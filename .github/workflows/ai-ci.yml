name: ai-ci

on:
  pull_request:
    paths:
      - 'P1/apps/ai/**'
      - 'P1/tests/**'
      - 'P1/.github/workflows/ai-ci.yml'
  push:
    branches: [main]

jobs:
  ai-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pillow pydantic-settings structlog colorlog
      - name: Run unit tests
        run: |
          cd P1/apps/ai && python -m pytest -q tests/unit tests/test_invoice_pipeline.py
      - name: Run integration tests
        run: |
          cd P1/apps/ai && python -m pytest -q tests/integration
